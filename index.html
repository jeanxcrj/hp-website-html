<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HP College Tour 2026 — Exploring Tomorrow. Empowering Today.</title>
<meta name="description" content="Exploring Tomorrow. Empowering Today.">
<link rel="icon" href="hp-logo.png">
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/yxt3aqw.css">
<style>
/* The blue is the logo's own — the asset is a single colour, #024AD8, so the
   mark, the type and the bars in the field are all literally one ink. */
:root{
  --blue:#024AD8;
  --blue-ink:#0b2f96;
  --ground:#ffffff;      /* the ground the corridor sits on */
  --paper:#ffffff;
  --bar-h:84px;
  --edge:clamp(16px,3.2vw,46px);
  --hero-x:clamp(20px,8vw,118px);
  --card-w:min(430px,40vw);
  --mono:"forma-djr-mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;background:var(--ground);color:var(--blue);
  font-family:var(--mono);-webkit-font-smoothing:antialiased;
  /* the corridor is a drag surface for the vanishing point, so no text caret */
  -webkit-user-select:none;user-select:none;
}

/* ---------- the field ----------
   One canvas behind everything, sized to the window in CSS pixels; field.js
   handles the device-pixel scaling itself. */
#field{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

/* ---------- header ----------
   A solid band of the ink across the top, the way the reference cuts the
   corridor off rather than fading it out. */
.bar{
  position:fixed;top:0;left:0;right:0;height:var(--bar-h);z-index:3;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--edge);background:var(--blue);color:#fff;
  transform:translateY(-100%);
}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
/* brightness(0) invert(1) turns every opaque pixel white; the letterforms are
   knocked out of the disc as transparency, so the band shows through them and
   the mark reads white-on-blue without a second asset. */
.brand img{width:38px;height:38px;display:block;filter:brightness(0) invert(1)}
.brand span{font-size:11px;line-height:1.36;letter-spacing:.05em;word-spacing:-.3em;font-weight:700}
.host{
  font-size:11px;letter-spacing:.05em;word-spacing:-.3em;font-weight:700;color:#fff;text-decoration:none;
  border:1px solid #fff;padding:7px 13px;transition:background .18s ease,color .18s ease;
}
.host:hover{background:#fff;color:var(--blue)}

/* ---------- hero ---------- */
main{position:relative;z-index:2;height:100%;
  padding:calc(var(--bar-h) + clamp(40px,7vh,86px)) var(--edge) 0 var(--hero-x)}
.card{
  position:relative;width:var(--card-w);min-width:290px;
  background:var(--paper);border:1px solid var(--blue);
  padding:clamp(26px,3vw,40px) clamp(26px,3vw,40px) clamp(58px,7vw,86px);
  opacity:0;transform:translateY(18px);
}
h1{
  margin:0;font-size:clamp(26px,3.1vw,44px);line-height:1.24;font-weight:700;
  letter-spacing:-.02em;word-spacing:-.34em;color:var(--blue);
}
.tagline{
  margin:clamp(14px,1.6vw,20px) 0 0;font-size:clamp(11px,.95vw,13px);
  line-height:1.5;letter-spacing:.05em;word-spacing:-.3em;font-weight:700;color:var(--blue);
}
/* the cursor blinks the way a prompt does; it is the one moving thing in the
   type, so it carries the "still running" note on its own */
.caret{font-style:normal;animation:blink 1.15s steps(1,end) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}

/* Straddles the card's right edge, as in the reference — inside the box
   horizontally, but hanging past its border, so the two planes read as
   different depths rather than one panel. */
.register{
  position:absolute;right:clamp(-86px,-6vw,-40px);bottom:clamp(38px,5vw,64px);
  display:inline-block;color:#fff;text-decoration:none;
  font-size:clamp(12px,1.05vw,14px);letter-spacing:.13em;font-weight:700;
  padding:15px 27px;
  transition:transform .2s cubic-bezier(.22,1,.36,1);
  opacity:0;
}
/* xbox.js draws the slab into this SVG: the face, the two visible side faces
   and the hairline. It recedes toward the field's own vanishing point, so the
   button and the corridor agree about where the camera is. overflow must stay
   visible — the extrusion legitimately draws outside the anchor's box. */
.register svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.register span{position:relative;z-index:1}
.register:hover{transform:translateX(5px)}

/* ---------- sponsors ----------
   Pinned to the bottom-right corner, diagonally opposite the card, so the two
   plates bracket the corridor rather than stacking on one side. Fixed rather
   than in flow: the page never scrolls, and the plate belongs to the frame.
   z-index sits above the field but under the header band.
   The logos keep their own brand colours — the white plate is what makes that
   safe over a field this saturated. */
.spon{
  position:fixed;z-index:2;
  right:var(--edge);bottom:clamp(20px,3.6vh,36px);
  width:var(--card-w);min-width:290px;
  background:var(--paper);border:1px solid var(--blue);
  overflow:hidden;opacity:0;
}
.spon__track{
  display:flex;align-items:center;gap:38px;width:max-content;
  padding:15px 0 15px 38px;
  animation:slide 26s linear infinite;
}
.spon:hover .spon__track{animation-play-state:paused}
/* The set is duplicated once in the markup and the track travels exactly half
   its own width, so the second copy lands where the first began — seamless,
   with no jump to hide. */
@keyframes slide{to{transform:translateX(-50%)}}
.spon img{display:block;height:17px;width:auto;flex:none}
/* Square and near-square marks read smaller than wordmarks at equal height,
   so they get a little more. */
.spon img.sq{height:25px}
.spon img.md{height:22px}
/* feather both ends so logos arrive and leave instead of being cut by the edge */
.spon__mask{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,var(--paper) 0,rgba(255,255,255,0) 9%,
    rgba(255,255,255,0) 91%,var(--paper) 100%);
}

/* ---------- entrance ----------
   Everything arrives after the field has already been flying for a moment, so
   the page reads as a window onto something that was running before you got
   there. */
.bar{animation:drop .7s cubic-bezier(.22,1,.36,1) .15s forwards}
.card{animation:rise .8s cubic-bezier(.22,1,.36,1) .5s forwards}
.register{animation:rise .6s cubic-bezier(.22,1,.36,1) .95s forwards}
.spon{animation:rise .7s cubic-bezier(.22,1,.36,1) 1.15s forwards}
@keyframes drop{to{transform:translateY(0)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}

@media (max-width:720px){
  :root{--bar-h:68px}
  .brand span{font-size:10px}
  /* the register button sits inside the card on this breakpoint; the tagline
     added below the h1 needs the floor raised or the two collide */
  .card{width:min(100%,420px);padding-bottom:92px}
  main{padding-left:var(--edge)}
  .register{right:auto;left:clamp(26px,3vw,40px);bottom:clamp(20px,4vw,26px)}
  /* a 40vw plate is a sliver on a phone — span the gutters instead, and clear
     the register button, which has moved to the bottom-left on this breakpoint */
  .spon{left:var(--edge);right:var(--edge);width:auto;min-width:0;bottom:14px}
  .spon__track{gap:26px;padding:12px 0 12px 26px}
}
@media (prefers-reduced-motion:reduce){
  .bar,.card,.register,.spon{animation-duration:.01ms;animation-delay:0ms}
  /* the entrance may snap, but a marquee that never stops cannot */
  .spon__track{animation:none}
  .caret{animation:none}
}
</style>
</head>
<body>

<canvas id="field" aria-hidden="true"></canvas>

<header class="bar">
  <a class="brand" href="#">
    <img src="hp-logo.png" alt="HP">
    <span>HP COLLEGE<br>TOUR 2026_</span>
  </a>
  <a class="host" href="#">HOST THE TOUR</a>
</header>

<main>
  <div class="card">
    <h1>HP COLLEGE<br>TOUR 2026<i class="caret">_</i></h1>
    <p class="tagline">Exploring Tomorrow.<br>Empowering Today.</p>
    <a class="register" href="#"><span>REGISTER</span></a>
  </div>

</main>

<div class="spon">
  <div class="spon__track">
    <img src="logos/solidworks.png" alt="SOLIDWORKS">
    <img src="logos/intel.svg" class="md" alt="Intel">
    <img src="logos/bentley.png" alt="Bentley Systems">
    <img src="logos/d5.png" class="sq" alt="D5 Render">
    <img src="logos/amd.png" alt="AMD">
    <img src="logos/solidworks.png" alt="" aria-hidden="true">
    <img src="logos/intel.svg" class="md" alt="" aria-hidden="true">
    <img src="logos/bentley.png" alt="" aria-hidden="true">
    <img src="logos/d5.png" class="sq" alt="" aria-hidden="true">
    <img src="logos/amd.png" alt="" aria-hidden="true">
  </div>
  <div class="spon__mask"></div>
</div>

<script src="field.js"></script>
<script src="xbox.js"></script>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('field');

  /* Tuned off the poster. The knot stays left and low, so the field still
     streams out from the left, but aspectXY is pulled well down from the
     original 1.8: the cloud now surrounds the knot rather than fanning into a
     flat band, which is what puts structure above the vanishing point as well
     as below it. hole holds a void open on the view axis so a near slab cannot
     park on the centre and plug it. The "zoomed in" read comes from thick —
     massive, fewer slabs at the same camera distance — not from moving the
     camera in. The bloom is wide and gaussian (washSoft) so the light
     disperses across the frame instead of stopping at a hard shoulder. */
  var field = new ExtrusionField(canvas, {
    count: 220, seed: 12,
    spread: 1500, aspectXY: 1.15, clump: 0.55, hole: 0.13, cone: 0.55,
    zNear: 620, zFar: 10000, zPow: 1.35,
    lenMin: 900, lenMax: 5600, lenDepth: 0.8,
    thick: 400, thickVar: 0.5, flat: 0.30, flatVar: 0.6,
    faces: true, faceShade: 0.36,
    fade: 0.76, fadePow: 1.5, grad: 0.55, gradPow: 1, gradStops: 22,
    /* minPx 2 rather than the default 1.2: with the hairline on, anything
       smaller is more stroke than fill and reads as grit */
    minPx: 4, edge: 0.5, edgeCol: '#ffffff', edgeFade: true,
    /* Flat dark marks drifting through the field, off for now. The tuning
       below is kept so chips: 7 switches them straight back on. */
    chips: 0, chipCol: '#17287F',
    chipMinW: 0.03, chipMaxW: 0.105, chipMinH: 8, chipMaxH: 24, chipDrift: 0.0035,
    /* dissolve in and out of the depth loop instead of popping — measured:
       the ramp runs at both ends of the loop, so past ~0.3 it starts bleaching
       the near slabs, which are the ones carrying the colour */
    wrapFade: 0.16,
    /* dissolve at the frame border instead of being clipped by it */
    borderFade: 0.38,
    fov: 70, vpX: 0.37, vpY: 0.58,
    col: '#024AD8', bg: '#ffffff', wash: 0, washCol: '#ffffff', washR: 0.88, washSoft: 2.8,
    speed: 760, parallax: 0.055, ease: 0.05
  });

  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* The flight arrives already at speed and settles into its cruise — the page
     opens mid-journey instead of starting from rest. */
  var warp = reduced ? 1 : 5.5;
  field.speedScale = warp;
  (function settle() {
    if (warp > 1.002) {
      warp += (1 - warp) * 0.045;
      field.speedScale = warp;
      requestAnimationFrame(settle);
    } else field.speedScale = 1;
  })();

  /* Pointer steers the vanishing point; the engine eases toward it itself, so
     this only has to report where the pointer is. */
  if (!reduced) {
    addEventListener('pointermove', function (e) {
      field.pointer.x = e.clientX / innerWidth;
      field.pointer.y = e.clientY / innerHeight;
    }, { passive: true });
  }

  /* Drag steers harder than hover: while the pointer is down the vanishing
     point takes the full width of the window rather than a sliver of it.
     Only from the backdrop, though — pressing the card, the header or any
     control is someone using the page, not aiming the corridor, and swinging
     the whole field under their cursor as they click REGISTER reads as a bug. */
  var basePar = field.P.parallax, steering = false;
  var UI = 'a, button, input, .card, .bar, .spon';
  addEventListener('pointerdown', function (e) {
    if (e.target && e.target.closest && e.target.closest(UI)) return;
    steering = true;
    field.set({ parallax: 0.55, ease: 0.12 });
  });
  addEventListener('pointerup', function () {
    if (!steering) return;          // never started, so nothing to restore
    steering = false;
    field.set({ parallax: basePar, ease: 0.05 });
  });

  /* Wheel is a throttle, not a scroll — the page has nowhere to go, so the
     gesture drives the flight instead. It always falls back to cruise. */
  var boost = 1, boostRaf = 0;
  addEventListener('wheel', function (e) {
    e.preventDefault();
    boost = Math.max(0.15, Math.min(6, boost + e.deltaY * 0.0016));
    if (!boostRaf) boostRaf = requestAnimationFrame(function decay() {
      boost += (1 - boost) * 0.03;
      field.speedScale = warp > 1.002 ? warp : boost;
      if (Math.abs(boost - 1) > 0.004) boostRaf = requestAnimationFrame(decay);
      else { boost = 1; boostRaf = 0; field.speedScale = 1; }
    });
  }, { passive: false });

  addEventListener('resize', function () {
    field.resize();
    if (reduced) field.draw();   // no loop running to repaint it
  });

  /* A hidden tab renders nothing; coming back should not jump the field
     forward by however long you were away. */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) field.stop(); else field.start();
  });

  /* ---------- the REGISTER slab ----------
     It shares the field's live (parallaxed) vanishing point, so steering the
     corridor re-angles the button's extrusion with it. Redrawing its SVG every
     frame would be waste, so it only redraws when the point has actually moved
     or the hover depth is still settling. */
  var slab = new ExtrudedBox(document.querySelector('.register'), {
    col: '#024AD8', bg: '#ffffff', edgeCol: '#ffffff', edge: 0.5, faceShade: 0.36
  });
  var lastVX = NaN, lastVY = NaN;
  function drawSlab(force) {
    var moved = force || Math.abs(field.vp.x - lastVX) > 0.0004
                      || Math.abs(field.vp.y - lastVY) > 0.0004;
    if (!moved && Math.abs(slab.k - slab.kTarget) < 0.0004) return;
    slab.set({ vpX: field.vp.x, vpY: field.vp.y });
    slab.draw();
    lastVX = field.vp.x; lastVY = field.vp.y;
  }
  (function slabTick() { drawSlab(false); requestAnimationFrame(slabTick); })();
  addEventListener('resize', function () { drawSlab(true); });
  /* the face changes width once the real mono lands, so re-lay the slab then */
  if (document.fonts) document.fonts.ready.then(function () { drawSlab(true); });

  field.start();
  if (reduced) field.stop(), field.draw();

  window.field = field;   // so the console can poke at it while tuning
})();
</script>
</body>
</html>
