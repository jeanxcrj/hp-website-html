<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extrusion Field — bare</title>
<style>
  /* No chrome at all. The canvas is the page: it fills the viewport, the body
     cannot scroll, and nothing paints on top of it. The engine does its own
     device-pixel scaling, so the element just needs a box to fill. */
  html,body{margin:0;height:100%;overflow:hidden;background:#fff}
  #field{position:fixed;inset:0;width:100%;height:100%;display:block;
    -webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<script src="field.js"></script>
<script>
(function () {
  'use strict';

  /* Same parameters as the live hero on index.html, copied verbatim so this
     page shows the real thing rather than a lookalike. Everything the site
     layered on top of the engine — the scroll whiten, the freeze, the morph
     into the sheet, the nav and the cards — is simply absent here, so the
     corridor flies forever at its cruise. */
  var field = new ExtrusionField(document.getElementById('field'), {
    count: 220, seed: 12,
    spread: 1500, aspectXY: 1.15, clump: 0.55, hole: 0.13, cone: 0.55,
    zNear: 620, zFar: 10000, zPow: 1.35,
    lenMin: 900, lenMax: 5600, lenDepth: 0.8,
    thick: 400, thickVar: 0.5, flat: 0.30, flatVar: 0.6,
    faces: true, faceShade: 0.36,
    fade: 0.76, fadePow: 1.5, grad: 0.55, gradPow: 1, gradStops: 22,
    minPx: 4, edge: 0.5, edgeCol: '#ffffff', edgeFade: true,
    chips: 0, chipCol: '#17287F',
    chipMinW: 0.03, chipMaxW: 0.105, chipMinH: 8, chipMaxH: 24, chipDrift: 0.0035,
    wrapFade: 0.16,
    borderFade: 0.38,
    fov: 70, vpX: 0.37, vpY: 0.58,
    col: '#024AD8', bg: '#ffffff', wash: 0, washCol: '#ffffff', washR: 0.88, washSoft: 2.8,
    speed: 340, parallax: 0.055, ease: 0.05
  });

  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* The arrival burst, kept: the flight opens already at speed and settles into
     its cruise. On the site this was also driven down by the scroll morph; with
     no scroll here it just decays to 1 and stays there. */
  var warp = reduced ? 1 : 5.5;
  function drive() { field.speedScale = warp; }
  drive();
  (function settle() {
    if (warp > 1.002) {
      warp += (1 - warp) * 0.045;
      drive();
      requestAnimationFrame(settle);
    } else { warp = 1; drive(); }
  })();

  /* Pointer steers the vanishing point; the engine eases toward it itself. */
  if (!reduced) {
    addEventListener('pointermove', function (e) {
      field.pointer.x = e.clientX / innerWidth;
      field.pointer.y = e.clientY / innerHeight;
    }, { passive: true });
  }

  /* Drag steers harder than hover — on the site this had to skip clicks on the
     UI, but there is no UI here, so every press is aiming the corridor. */
  var basePar = field.P.parallax, steering = false;
  addEventListener('pointerdown', function () {
    steering = true;
    field.set({ parallax: 0.55, ease: 0.12 });
  });
  addEventListener('pointerup', function () {
    if (!steering) return;
    steering = false;
    field.set({ parallax: basePar, ease: 0.05 });
  });

  /* The engine builds in its constructor but does not run until told to —
     start() is what index.html calls too. Without it the canvas stays blank. */
  addEventListener('resize', function () { field.resize(); }, { passive: true });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) field.stop(); else field.start();
  });
  field.start();
  if (reduced) { field.stop(); field.draw(); }   // one still frame, no flight
})();
</script>
</body>
</html>
