  </div>

  <footer id="foot"></footer>
</main>

<script src="field.js?v=20261003"></script>
<script src="tour.js?v=20261003"></script>

<script>
  PAGES.register(document.getElementById('reg'));
  PAGES.backdrop(document.getElementById('field'));
  PAGES.nav(document.querySelector('.bar'));
  PAGES.footer(document.getElementById('foot'));
  PAGES.reveal();
</script>
